name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: tier boundaries
        run: scripts/check-tiers.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: doc tests and missing docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: tier-1 builds on wasm
        run: cargo check -p rl-core -p rl-grid -p rl-mapgen -p rl-world -p rl-content -p rl-rules --target wasm32-unknown-unknown
      - name: benches compile
        run: cargo bench --workspace --no-run

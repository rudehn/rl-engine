name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The release runs this same check with the documentation steps on, before
  # it publishes: between releases the docs wait, so main stays green while
  # the system pages and the inventory lag the code.
  workflow_call:
    inputs:
      docs:
        description: Also check that the guide, the inventory and the system pages keep up with the code.
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    # One job builds the workspace four times over: tests, the generated
    # template in its own target directory, wasm, and the benches. Debug
    # info is the bulk of each, and the runner has 14 GB, so this job ran
    # the disk out. Nothing here reads a backtrace.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_BENCH_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      # The runner image ships language toolchains this build has no use
      # for, and they are tens of gigabytes.
      - name: room to build in
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      # Bevy links against the Linux audio, input and windowing libraries,
      # and system font discovery against fontconfig; the runner image
      # ships none of them.
      - name: bevy system dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: formatting
        run: cargo fmt --all --check
      - name: tier boundaries
        run: scripts/check-tiers.sh
      - name: every public type name is declared once
        run: scripts/check-names.sh
      - name: the prelude names each thing once
        run: scripts/check-prelude.py
      - name: the guide's links into the code
        if: inputs.docs
        run: scripts/check-guide.sh
      - name: the inventory keeps up with the code
        if: inputs.docs
        run: scripts/check-overview.sh
      - name: the system reference keeps up with the code
        if: inputs.docs
        run: python3 scripts/check-systems.py
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest pools every test in one run and skips doc-tests, which
      # `cargo test --doc` runs.
      - name: tests
        run: cargo nextest run --workspace --profile ci
        env:
          ATGLYPH_FULL_SEEDS: 1
      # The slowest tests and the run's processor time against CI's own
      # budget, which warns rather than fails: the runner is not the
      # machine the everyday budget was measured on, and it plays every
      # seed. The everyday budget fails in scripts/gate.sh.
      - name: test times
        if: success() || failure()
        run: python3 scripts/test-times.py --profile ci --check full --top 20
      - name: doc-tests
        run: cargo test --workspace --doc
      - name: the starter template generates and builds
        run: scripts/check-template.sh
      - name: every crate packages for crates.io
        run: scripts/check-publish.sh
      - name: doc tests and missing docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: tiers 0 and 1 build on wasm
        run: scripts/check-tiers.sh --wasm
      - name: benches compile
        run: cargo bench --workspace --no-run

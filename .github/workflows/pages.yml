name: pages
# The guide, built and published, so there is somewhere to send a reader
# that is not a raw markdown file. The chapters hold real code either way,
# which scripts/expand-guide.py keeps true; this is for the sidebar, the
# search and a link that fits in a release note.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    outputs:
      site: ${{ steps.site.outputs.on }}
    steps:
      - uses: actions/checkout@v5
      # The bundles themselves, keyed on what they are built from. A hit
      # skips sixteen minutes of wasm; a miss costs what it always did.
      # Caching the finished bundles rather than the build directory keeps
      # this at a couple of hundred megabytes instead of nine gigabytes,
      # which matters because the repository's cache is nearly full and
      # anything evicted is a cache CI wanted.
      - name: the demos, if they have been built before
        id: bundles
        uses: actions/cache@v4
        with:
          path: docs/guide/src/demos
          key: demos-${{ hashFiles('examples/tutorial/src/bin/step0*.rs', 'examples/tutorial/assets/**', 'Cargo.lock', 'Cargo.toml') }}
      - name: room to build in
        if: steps.bundles.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: mdbook
        env:
          MDBOOK_VERSION: "0.5.4"
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
      # The playable demos: each tutorial step built to wasm and dropped
      # into the book, which mdBook then copies as static files. This is
      # the slow half of the job, and it is why the book is worth
      # publishing at all.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.bundles.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.bundles.outputs.cache-hit != 'true'
      - name: bevy system dependencies
        if: steps.bundles.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libfontconfig1-dev
      - name: trunk
        if: steps.bundles.outputs.cache-hit != 'true'
        env:
          TRUNK_VERSION: "0.21.14"
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
      - name: the playable demos
        if: steps.bundles.outputs.cache-hit != 'true'
        run: scripts/build-demos.sh
      - name: build the guide
        run: mdbook build docs/guide
      # Publishing needs a Pages site, and only a repository admin can
      # make one: the workflow token is refused, enablement parameter or
      # not. So say that plainly once, and let the rest of the job stand
      # down instead of failing every push until somebody clicks it.
      - name: is there a site to publish to
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The guide built, but GitHub Pages is off for this repository, so there is nowhere to publish it. Settings > Pages > Source: GitHub Actions turns it on, and the next push puts the book up."
          fi
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.on == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.on == 'true'
        with:
          path: docs/guide/book

  deploy:
    needs: build
    if: needs.build.outputs.site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

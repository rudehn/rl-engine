name: pages
# The guide, built and published, so there is somewhere to send a reader
# that is not a raw markdown file. The chapters hold real code either way,
# which scripts/expand-guide.py keeps true; this is for the sidebar, the
# search and a link that fits in a release note.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: mdbook
        env:
          MDBOOK_VERSION: "0.4.40"
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
      - name: build the guide
        run: mdbook build docs/guide
      # The repository has no Pages site until something makes one, and
      # the action's own failure is the only place that is said. This
      # turns it on for the workflow rather than leaving it a setting
      # somebody has to have clicked.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guide/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

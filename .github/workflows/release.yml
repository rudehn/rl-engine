name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME is not v$version, the workspace version" >&2
            exit 1
          fi
      # From the changelog, so the page and CHANGELOG.md are one text. A tag
      # pushed again, or a page made by hand first, is edited rather than
      # refused.
      - name: publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

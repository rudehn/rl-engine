name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # Everything CI checks, the documentation included: a release is the one
  # point the docs are brought up to the code, so it is the one point they
  # are held to it.
  check:
    uses: ./.github/workflows/ci.yml
    with:
      docs: true
  # Before anything is published, which cannot be undone: a tag on a commit
  # whose workspace version is another number would put up a release page,
  # and with crates.io on crates, at the wrong version.
  version:
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME is not v$version, the workspace version" >&2
            exit 1
          fi
  # The crates.io half, off until the repository variable PUBLISH_CRATES is
  # 'true': a release is a tag and its GitHub page, and a game depends on the
  # engine from git by that tag. Both jobs stay whole so that turning
  # crates.io on is the one setting.
  #
  # Breaking changes against the last published version of each crate. A
  # crate never published has nothing to be checked against and is noticed,
  # not failed.
  semver:
    needs: [check, version]
    if: vars.PUBLISH_CRATES == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      # The same preparation as ci.yml's check job: cargo publish and
      # semver-checks both build the crates, and Bevy needs these libraries
      # and the room.
      - name: room to build in
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: bevy system dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks
      - run: python3 scripts/publish.py --semver
  # Every crate, in dependency order. crates.io trusts a publisher only for a
  # crate that already exists, so the first release uses the repository secret
  # CARGO_REGISTRY_TOKEN; once it is deleted, the job trades its OIDC token for
  # one. A run cut short, by the new-crate rate limit or otherwise, is re-run
  # from the Actions page and publishes what is left. A secret cannot be read
  # in a job-level `if`, so it is passed through `env` and tested per step.
  publish:
    needs: [check, version, semver]
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
      SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # The same preparation as ci.yml's check job: cargo publish and
      # semver-checks both build the crates, and Bevy needs these libraries
      # and the room.
      - name: room to build in
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: bevy system dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: trade the OIDC token for a publish token
        id: auth
        if: env.SECRET_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1
      - name: publish the crates not yet up
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.SECRET_TOKEN }}
        run: python3 scripts/publish.py --publish
  # After the crates when they are published, so a page never announces a
  # version crates.io refused; when they are not, a skipped publish is no
  # reason to stand down, and the page waits on the checks alone.
  page:
    needs: [check, version, publish]
    if: >-
      ${{ !cancelled()
      && needs.check.result == 'success'
      && needs.version.result == 'success'
      && (vars.PUBLISH_CRATES != 'true' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The page is the tag's CHANGELOG.md section, verbatim. A tag pushed
      # again, or a page made by hand first, is edited rather than refused.
      - name: publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { f = index($0, "## [" v "]") == 1; next } /^\[[^]]+\]: / { f = 0 } f' CHANGELOG.md | sed '/./,$!d' > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
  # The guide, published only once the documentation checks above have
  # passed. A called workflow gets no more than its caller grants, and this
  # workflow grants only `contents: write`, so the job grants what a Pages
  # deployment needs itself.
  guide:
    needs: check
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

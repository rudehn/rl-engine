[package]
name = "tutorial"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Warren: the game the guide in docs/guide builds, one runnable binary per chapter."
publish = false

[package.metadata.atglyph]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 3

[dependencies]
atglyph.workspace = true
bevy.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
serde.workspace = true

# Links Bevy as one shared library on the desktop, so a change rebuilds and
# links this game, its tests included, in seconds rather than copying all of
# Bevy in. Nothing here is shipped as a native binary, only the tutorial's
# wasm demos, which have no shared libraries. A binary so linked runs through
# `cargo run`, which tells the loader where Bevy's library is.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[package]
name = "undermere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "A worked example: a delve under a lakeside town to the thing that drowned it, on rl-engine."

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 3

[dependencies]
rl-engine.workspace = true
bevy.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
serde.workspace = true
ron.workspace = true

[dev-dependencies]
# Reads the typeface's character map, so the tests hold every glyph the game
# draws to the face it is drawn in.
ttf-parser.workspace = true

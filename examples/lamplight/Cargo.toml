[package]
name = "lamplight"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lamplight: one dark cave, a lantern, a brazier, a wisp and a lurker, the engine's lighting shown in one file."
publish = false

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 3

[dependencies]
rl-engine.workspace = true
bevy.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }

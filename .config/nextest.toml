      | test(=droids::alarm::tests::a_probe_beside_an_idle_player_backs_off_and_never_comes_nearer_than_three_again_over_a_range_of_seeds)
      | test(=lifts::tests::every_deck_has_one_lift_up_and_but_the_core_one_down_to_the_decks_beside_it_through_a_save_over_a_span_of_seeds)
      | test(=lifts::tests::going_through_each_lift_down_reaches_the_next_deck_and_the_last_has_none_over_a_span_of_seeds)
      | test(=loot::tests::deck_one_lays_out_no_energy_weapon_and_only_the_gun_that_runs_dry_over_a_span_of_seeds)
      | test(=loot::tests::every_real_deck_scatters_walkable_items_beside_their_own_marks_over_a_span_of_seeds)
      | test(=mission::tests::every_charge_deck_stands_a_console_on_its_reactor_mark_over_a_span_of_seeds)
      | test(=props::tests::a_prop_that_blocks_never_seals_off_anything_the_deck_could_reach_over_a_span_of_seeds)
      | test(=props::tests::every_prop_slot_on_every_deck_holds_its_prop_over_a_span_of_seeds)
    )
    |
    package(rl-mapgen) & (
        test(=accrete::tests::the_walk_to_the_far_side_of_a_barrier_is_on_average_longer_than_without_it)
      | test(=dress::tests::nothing_stands_beside_an_opening_and_every_area_stays_one_region)
      | test(=lakes::tests::a_lake_that_may_cut_leaves_islands_and_the_bridges_join_every_one)
      | test(=lakes::tests::a_place_left_in_parts_is_grown_again)
      | test(=lakes::tests::no_lake_or_bridge_reaches_past_a_lock_on_a_piece_drawn_cell_by_cell)
    )
    |

# Every test process runs inside one of the machine's slots, the same ones
# every compile takes (scripts/slot says why), so two agents' test runs share
# the cores rather than each taking all of them. Wrapper scripts are still an
# experimental feature of nextest; a version that changes them fails here, at
# parse, rather than running tests unthrottled.
experimental = ["wrapper-scripts"]

[scripts.wrapper.slot]
command = { command-line = "scripts/slot", relative-to = "workspace-root" }

# nextest pools every test of the workspace, so on a quiet machine the wall
# time of a run is the processor time of all its tests over the cores, and
# a long test that starts late adds itself on the end. A test that runs past
# the slow period is named while the run is still going. Every test's wall
# time goes to junit.xml and scripts/slot adds its processor time beside it,
# which scripts/test-times.py reads and holds to the suite's budget.
[profile.default]
slow-timeout = { period = "30s" }
# The fast tier: everything but the slow tier, which is every test that took
# two seconds of processor time or more when the tiers were last drawn, on
# 2026-10-16 by the data-validation slice, and each game's backstop: the
# whole-generator sweeps that grow every place of a run once a seed and ask
# every promise of it, the walks down every stair and lift, the every-recipe
# sweep, the play-throughs and the long behaviour checks, named below by
# package and full path. A test the last draw found between one and a half
# and two seconds stays where it was, since it would flip between the tiers
# from run to run. A scoped gate runs this; `--profile full`, the gate's
# `--all`, and CI run both tiers. The fingerprints stay in the fast tier on
# purpose, as the early warning that a change moved play.
# scripts/test-times.py names a fast-tier test past two seconds as one to
# move here or make cheaper. AGENTS.md, "Writing fast tests", says when
# each tier runs, how to run one area's slow tests while working on it,
# and which of the four kinds of test each kind is.
default-filter = """
not (
    package(foundry) & (
        test(=decks::tests::every_deck_of_a_run_keeps_every_promise_the_generator_makes_over_a_span_of_seeds)
      | test(=droids::alarm::tests::a_probe_beside_an_idle_player_backs_off_and_never_comes_nearer_than_three_again_over_a_range_of_seeds)
      | test(=lifts::tests::every_deck_ridden_down_to_is_joined_reachable_furnished_and_stocked_through_a_save_over_a_span_of_seeds)
    )
    |
    package(atglyph-mapgen) & (
        test(=accrete::tests::the_walk_to_the_far_side_of_a_barrier_is_on_average_longer_than_without_it)
      | test(=dress::tests::nothing_stands_beside_an_opening_and_every_area_stays_one_region)
      | test(=lakes::tests::a_lake_that_may_cut_leaves_islands_and_the_bridges_join_every_one)
      | test(=lakes::tests::a_place_left_in_parts_is_grown_again)
      | test(=lakes::tests::no_lake_or_bridge_reaches_past_a_lock_on_a_piece_drawn_cell_by_cell)
    )
    |
    package(atglyph-rules) & (
        test(=pool::tests::an_entry_is_never_drawn_outside_its_floors_or_its_tags)
      | test(=pool::tests::every_budget_is_met_whenever_the_pool_can_meet_it)
      | test(=pool::tests::every_entry_is_drawn_somewhere_over_the_seeds)
      | test(=pool::tests::no_limit_is_exceeded_and_no_group_shares_a_floor)
    )
    |
    package(undermere) & (
        test(=dungeon::tests::every_place_of_a_run_keeps_every_promise_the_generator_makes_over_a_span_of_seeds)
      | test(=stairs::tests::every_floor_walked_down_to_is_joined_to_the_next_and_never_cut_off_by_what_stands_on_it_through_a_save_over_a_span_of_seeds)
    )
)
"""

[profile.default.junit]
path = "junit.xml"

# Both tiers, for a branch's end: `scripts/gate.sh --all`.
[profile.full]
default-filter = "all()"

[profile.full.junit]
path = "junit.xml"

# CI runs both tiers and reports every failure of a run, not only the first.
[profile.ci]
default-filter = "all()"
fail-fast = false
slow-timeout = { period = "30s" }

[profile.ci.junit]
path = "junit.xml"

[[profile.default.scripts]]
filter = "all()"
run-wrapper = "slot"

[[profile.full.scripts]]
filter = "all()"
run-wrapper = "slot"

[[profile.ci.scripts]]
filter = "all()"
run-wrapper = "slot"

# The fingerprints first: each is one long scripted run in a binary of its
# own, which nextest schedules after the libraries, so Undermere's otherwise
# began once nearly everything else was done and played on alone at the end.
[[profile.default.overrides]]
filter = "binary(fingerprint)"
priority = 100

[[profile.ci.overrides]]
filter = "binary(fingerprint)"
priority = 100

[[profile.full.overrides]]
filter = "binary(fingerprint)"
priority = 100

[workspace]
resolver = "3"
members = ["crates/*", "examples/corsair", "examples/delve", "examples/heist", "examples/tutorial"]
# A template renders into a game of its own; scripts/check-template.sh builds it.
exclude = ["templates"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rudehn/rl-engine"
homepage = "https://github.com/rudehn/rl-engine"
rust-version = "1.88"

[workspace.dependencies]
rl-core = { path = "crates/rl-core" }
rl-grid = { path = "crates/rl-grid" }
rl-mapgen = { path = "crates/rl-mapgen" }
rl-world = { path = "crates/rl-world" }
rl-rules = { path = "crates/rl-rules" }
rl-save = { path = "crates/rl-save" }
rl-engine = { path = "crates/rl-engine" }
rl-bevy = { path = "crates/rl-bevy" }
rl-render = { path = "crates/rl-render" }
rl-overworld = { path = "crates/rl-overworld" }
rl-ui = { path = "crates/rl-ui" }

# Default features off: they include OS entropy through getrandom, which
# does not build for wasm32-unknown-unknown, and engine code never seeds
# from entropy. Each crate names the features it uses.
rand = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
noise = "0.9"
# `system_font_discovery` lets the terminal ask for a generic monospace family
# instead of shipping a font asset; Bevy's built-in font lacks box-drawing glyphs.
# Named rather than defaulted: the defaults carry 3D, glTF, audio, animation,
# gizmos, scenes, picking and Bevy's own UI, none of which a glyph terminal
# draws with, and all of which a browser would download. `default_font` is
# the embedded ASCII face a browser falls back to, since there is no system
# font database there for `system_font_discovery` to search.
bevy = { version = "0.19", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "bevy_state",
    "bevy_log",
    "bevy_color",
    "default_font",
    "system_font_discovery",
    "serialize",
    "multi_threaded",
    "png",
    "webgl2",
    "x11",
    "wayland",
    "std",
    "async_executor",
] }
criterion = { version = "0.5", features = ["html_reports"] }

# Worldgen and pathfinding are math-heavy; an unoptimised debug run takes
# seconds per map. Dependencies get full optimisation, workspace crates a
# light pass so debug builds stay quick to compile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.bench]
debug = true

[package]
name = "rl-save"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rl-engine tier 2: a save backend seam, a versioned schema policy, entity remapping, and the engine's own state captured and restored."
homepage.workspace = true
keywords = ["roguelike", "bevy", "save-game", "serialization", "persistence"]
categories = ["game-development", "encoding"]

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 2

[dependencies]
rl-core.workspace = true
rl-grid.workspace = true
# The ids an ability's pools and cooldowns are keyed by, in the save.
rl-rules.workspace = true
rl-bevy.workspace = true
bevy.workspace = true
serde.workspace = true
ron.workspace = true

[dev-dependencies]
rl-mapgen.workspace = true
rl-world.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `Storage` for the saves themselves; `Event` and `EventTarget` for the
# unload bridge's listener, and `wasm-bindgen` for the closure it leaks.
web-sys = { version = "0.3", features = ["Window", "Storage", "Event", "EventTarget"] }
wasm-bindgen = "0.2"

[package]
name = "atglyph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A modular roguelike engine for Rust and Bevy: turn-based grid gameplay, procedural dungeon and world generation, FOV, pathfinding, AI, saves."
homepage.workspace = true
documentation = "https://docs.rs/atglyph"
readme = "../../README.md"
keywords = ["roguelike", "bevy", "game-engine", "procgen", "turn-based"]
categories = ["game-engines", "game-development"]

[package.metadata.atglyph]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 3

[dependencies]
atglyph-core.workspace = true
atglyph-grid.workspace = true
atglyph-mapgen.workspace = true
atglyph-rules.workspace = true
atglyph-save.workspace = true
atglyph-bevy.workspace = true
atglyph-render.workspace = true
atglyph-ui.workspace = true
# `RoguelikePlugins` opens the window, so the facade names Bevy's own
# defaults. Every crate it gathers already depends on Bevy.
bevy.workspace = true
# Re-exported as `atglyph::rand`, so a game draws from the same `rand` the
# engine does; `StdRng` is the generator every stream is made of.
rand = { workspace = true, features = ["std", "std_rng"] }

# The text terminal front end, `TtyRoguelikePlugins`. A terminal is a
# desktop thing, and its crate does not build for the web, so the wasm demos
# never compile it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atglyph-tty.workspace = true

# Tests and benches link Bevy as one shared library, so each test binary links
# in seconds rather than copying all of Bevy in. A dev-dependency never reaches
# a game built on this crate, which links Bevy however it chooses; wasm has no
# shared libraries.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

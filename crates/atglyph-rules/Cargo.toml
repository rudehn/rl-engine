[package]
name = "atglyph-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "atglyph tier 1: content registries, stats, damage, statuses, factions, equipment, monster AI, quests and balance scoring, as shapes the game fills. No Bevy."
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/atglyph-rules"
keywords = ["roguelike", "rpg", "monster-ai", "quests", "gamedev"]
categories = ["game-development"]

[package.metadata.atglyph]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 1

[dependencies]
atglyph-core.workspace = true
atglyph-grid.workspace = true
atglyph-mapgen.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
serde.workspace = true
ron.workspace = true

[package]
name = "rl-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rl-engine tier 2: roguelike UI for Bevy - panel views, a tone palette, a modal stack, a message log and menus."
homepage.workspace = true
keywords = ["roguelike", "bevy", "ui", "message-log", "gamedev"]
categories = ["game-development", "gui"]

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 2

[dependencies]
rl-core.workspace = true
# For `TargetMode`, the shape an ability menu describes.
rl-grid.workspace = true
rl-bevy.workspace = true
bevy.workspace = true
rl-rules.workspace = true
rl-render.workspace = true
rl-save.workspace = true

[dev-dependencies]
# A view test needs a real map to see across, and a real map needs the
# generation crates and the tiles. Dev-only, so nothing downstream pays for
# them. The targeting cursor itself resolves nothing: it asks the resolver's
# own `Bystanders::land`.
rl-mapgen.workspace = true
rl-world.workspace = true
criterion.workspace = true

[[bench]]
name = "frame"
harness = false

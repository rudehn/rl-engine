[package]
name = "rl-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rl-engine tier 2: Bevy plugins for a turn-based roguelike, with the turn loop, actions, combat, items, places and chunk streaming."
homepage.workspace = true
keywords = ["roguelike", "bevy", "turn-based", "ecs", "gamedev"]
categories = ["game-development", "game-engines"]

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 2

[dependencies]
rl-core.workspace = true
rl-grid.workspace = true
rl-mapgen.workspace = true
rl-world.workspace = true
rl-rules.workspace = true
serde.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
bevy.workspace = true

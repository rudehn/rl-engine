[package]
name = "rl-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rl-engine tier 1: procedural world generation with noise, hydrology, climate, sites, roads and seamless chunks. No Bevy."
homepage.workspace = true
keywords = ["roguelike", "procgen", "worldgen", "terrain", "noise"]
categories = ["game-development", "simulation"]

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 1

[dependencies]
rl-core.workspace = true
rl-grid.workspace = true
rl-mapgen.workspace = true
noise.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
serde.workspace = true

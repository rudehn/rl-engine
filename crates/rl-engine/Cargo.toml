[package]
name = "rl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A modular roguelike engine for Rust and Bevy: turn-based grid gameplay, procedural dungeon and world generation, FOV, pathfinding, AI, saves."
homepage.workspace = true
readme = "../../README.md"
keywords = ["roguelike", "bevy", "game-engine", "procgen", "turn-based"]
categories = ["game-engines", "game-development"]

[package.metadata.rl-engine]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 3

[dependencies]
rl-core.workspace = true
rl-grid.workspace = true
rl-mapgen.workspace = true
rl-world.workspace = true
rl-rules.workspace = true
rl-save.workspace = true
rl-bevy.workspace = true
rl-render.workspace = true
rl-overworld.workspace = true
rl-ui.workspace = true
# `RoguelikePlugins` opens the window, so the facade names Bevy's own
# defaults. Every crate it gathers already depends on Bevy.
bevy.workspace = true

# Tests and benches link Bevy as one shared library, so each test binary links
# in seconds rather than copying all of Bevy in. A dev-dependency never reaches
# a game built on this crate, which links Bevy however it chooses; wasm has no
# shared libraries.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[package]
name = "atglyph-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "atglyph tier 2: Bevy plugins for a turn-based roguelike, with the turn loop, actions, combat, items, places and chunk streaming."
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/atglyph-bevy"
keywords = ["roguelike", "bevy", "turn-based", "ecs", "gamedev"]
categories = ["game-development", "game-engines"]

[package.metadata.atglyph]
# Read by scripts/check-tiers.sh: 0 core, 1 no Bevy, 2 the Bevy layer, 3 the facade and games.
tier = 2

[dependencies]
atglyph-core.workspace = true
atglyph-grid.workspace = true
atglyph-mapgen.workspace = true
atglyph-rules.workspace = true
serde.workspace = true
ron.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
bevy.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "turns"
harness = false

[[bench]]
name = "passes"
harness = false

# Tests and benches link Bevy as one shared library, so each test binary links
# in seconds rather than copying all of Bevy in. A dev-dependency never reaches
# a game built on this crate, which links Bevy however it chooses; wasm has no
# shared libraries.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }
